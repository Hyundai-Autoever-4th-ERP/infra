name: erp-infra
services:
  gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8081}
      ITEM_SERVICE_URL: ${ITEM_SERVICE_URL:-http://host.docker.internal:8082}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://host.docker.internal:8083}
      PROCUREMENT_SERVICE_URL: ${PROCUREMENT_SERVICE_URL:-http://host.docker.internal:8084}
      SALES_SERVICE_URL: ${SALES_SERVICE_URL:-http://host.docker.internal:8085}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://host.docker.internal:8086}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_local_admin}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-services.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
